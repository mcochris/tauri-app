<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/src/style.css">
	<title>Audiostar</title>
	<script type="module" src="/src/main.ts"></script>
</head>

<body>
	<div id="header">
		<div id="header-left">
			<img src="/src/assets/icon2.png" alt="icon" width="64" height="64">
			<div id="title-text">Audiostar</div>
		</div>
		<div id="header-right">
			<a href="#" id="playlistButton">Playlist</a>
			<a href="#" id="ratingsButton">Ratings</a>
			<a href="#" id="spreadsheetButton">Spreadsheet</a>
			<a href="#" id="aboutButton">About</a>
			<a href="#" id="helpButton">Help</a>
		</div>
	</div>

	<div id="ratingsContainer">
		<p>Select a directory to view its contents:</p>
		<div id="currentPath"></div>
		<div id="directoryFiles"></div>
		<div id="musicFiles">
			<table>
				<thead>
					<tr>
						<th>File (click to play/pause)</th>
						<th>Rating</th>
					</tr>
				</thead>
				<tbody id="musicFilesTableBody">
				</tbody>
			</table>
		</div>
	</div>

	<div id="playlistContainer">
		<div id="playlistRatingButtons">
			<div>Rating:</div>
			<input type="button" name="1" value="1">
			<input type="button" name="2" value="2">
			<input type="button" name="3" value="3">
			<input type="button" name="4" value="4">
			<input type="button" name="5" value="5">
		</div>
		<div id="numberOfPlaylistFiles">
			Number of files in playlist: <span id="playlistFileCount">0</span>
		</div>
		<div id="playlistActionButtons">
			<input type="button" name="play" value="Play">
			<input type="button" name="pause" value="Pause">
			<input type="button" name="skip" value="Skip">
			<input type="button" name="randomize" value="Randomize">
		</div>
		<div id="playlistFiles">
			<table>
				<thead>
					<tr>
						<th>&nbsp;Play/<br>Pause</th>
						<th>Artist</th>
						<th>Album</th>
						<th>Song</th>
						<th>Rating</th>
					</tr>
				</thead>
				<tbody id="playlistFilesTableBody">
				</tbody>
			</table>
		</div>
	</div>
</body>

</html>
